[project]
name = "scc-mcp"
dynamic = ["version"]
description = "MCP server exposing boyter/scc code-counting and complexity tools to LLM agents."
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Nicholas Synovic", email = "nicholas.synovic@gmail.com" },
]
keywords = ["mcp", "scc", "sloc", "cloc", "code-metrics", "complexity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=3.4.2",
]

[project.urls]
Repository = "https://github.com/NicholasSynovic/scc-mcp"

[project.scripts]
scc-mcp = "scc_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "scc_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scc_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
